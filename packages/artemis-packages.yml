consequence: >-
  With no first-party SDK and no maintained community one, every consumer of api.nasa.gov writes raw
  HTTP against a query-string API key. That is workable for a read-only service, and it is also why
  the OpenAPI contracts in openapi/ matter more here than they would for a provider that ships
  clients: the spec is the only integration surface a generator can act on.
