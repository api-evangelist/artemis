note: >-
  THE HEADLINE FINDING IS AN ABSENCE. NASA publishes no first-party client library for the
  api.nasa.gov Open API surface in any language — not on npm, PyPI, RubyGems, Maven Central, NuGet,
  crates.io or pkg.go.dev, and the api.nasa.gov documentation links to none. Every package below is
  a third-party community wrapper, and every one of them is abandoned: the newest release in the set
  is February 2025 and the most-downloaded is frozen at March 2021. `official` is false on all of
  them and no SDKs pointer is emitted for this record, because emitting one would credit NASA with
  client libraries it does not ship. NASA does publish software on GitHub (Open MCT, Cumulus, GCN
  tooling) but none of it wraps this API surface.
