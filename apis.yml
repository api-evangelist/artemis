- aid: artemis:nasa-techport-api
  name: NASA TechPort API
  description: >-
    TechPort is NASA's public catalog of its technology development projects, including the technology
    investments made through the Artemis program. The API returns project records — funding, work
    locations, technology areas, destinations, investigators and closeout documents — in JSON or XML.
    NASA publishes a Swagger 2.0 contract for it (version 3.4.0) inside its own API catalog document
    at https://api.nasa.gov/assets/json/apis.json; that document is captured verbatim in this repo.
  humanURL: https://techport.nasa.gov/
