specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Artemis
providerId: artemis
generated: '2026-09-04'
method: searched
source: https://api.nasa.gov/assets/html/authentication.html
docs:
- https://api.nasa.gov/
- https://api.nasa.gov/assets/html/authentication.html
created: '2026-05-04'
modified: '2026-09-04'
note: >-
  Replaces the 2026-05-04 bulk-sweep scaffold, which invented a 1,000-requests-per-month quota and a
  paid shape that does not exist. NASA publishes no pricing page, no paid tier and no billing
  surface for the api.nasa.gov Open APIs: the entire catalog is a free US federal government data
  service. The only differentiation NASA publishes is the rate limit attached to a free registered
  key versus the shared DEMO_KEY, so both are recorded as plans with price 0.
plan_count: 2
currency: USD
pricing_model: free
paid_tiers: 0
plans:
- id: artemis-demo-key
  name: DEMO_KEY
  type: free
  price: '0.00'
  currency: USD
  billing_period: none
  signup_required: false
  description: >-
    The shared, unregistered key NASA uses in its own documentation examples. Usable immediately with
    no signup, rate limited per IP address.
  entries:
  - label: Hourly requests
    name: requests_per_hour
    type: quota
    metric: requests
    limit: 30
    timeFrame: hour
    scope: ip-address
  - label: Daily requests
    name: requests_per_day
    type: quota
    metric: requests
    limit: 50
    timeFrame: day
    scope: ip-address
  source: https://api.nasa.gov/assets/html/authentication.html
- id: artemis-developer-key
  name: Registered developer key
  type: free
  price: '0.00'
  currency: USD
  billing_period: none
  signup_required: true
  signup_url: https://api.nasa.gov/#signUp
  description: >-
    A free personal API key issued on self-serve signup (name and email). Applies across every
    api.nasa.gov API and, per NASA, across data from other federal agencies on the same api.data.gov
    gateway.
  entries:
  - label: Hourly requests
    name: requests_per_hour
    type: quota
    metric: requests
    limit: 1000
    timeFrame: hour
    scope: api-key
  source: https://api.nasa.gov/assets/html/authentication.html
overage:
  charged: false
  behaviour: >-
    There is no overage charge because there is no charge. Exceeding the limit returns HTTP 429
    OVER_RATE_LIMIT and temporarily blocks the key for the rolling hour.
enterprise:
  contact_only: true
  note: >-
    Higher limits are not sold; they are requested from the NASA organization that owns the
    individual API. No quote, contract or pricing page is published.
